<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вхід · SEO ТЗ</title><link rel="stylesheet" href="/static/style.css?v={{ v }}"></head>
<body class="login">
<form method="post" action="/login" class="card login-card">
  <h1>SEO ТЗ генератор</h1>
  <p class="muted">Введіть пароль доступу</p>
  {% if error %}<div class="alert">Невірний пароль</div>{% endif %}
  <input type="password" name="password" placeholder="Пароль" autofocus required>
  <button class="btn primary" type="submit">Увійти</button>
</form>
</body></html>
